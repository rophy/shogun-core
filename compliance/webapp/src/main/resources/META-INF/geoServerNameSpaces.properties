# Namespace -> GeoServer workspace OWS URL. "geoserver" is the compose service name.
# The secure interceptors expect workspace-bound URLs (unqualified layer names).
# "ows" is the global endpoint (/geoserver.action/ows, qualified names only).
cite=http://geoserver:8080/geoserver/cite/ows
topp=http://geoserver:8080/geoserver/topp/ows
sf=http://geoserver:8080/geoserver/sf/ows
cdf=http://geoserver:8080/geoserver/cdf/ows
cgf=http://geoserver:8080/geoserver/cgf/ows
ows=http://geoserver:8080/geoserver/ows
