# Settings for the OGC compliance test setup (see ../../../../../README.md).

# OGC CITE layers and coverages that get a layer entity with READ for the test
# user "user". WMS, WFS and WCS use the WMS layer entity, WMTS the WMTS one.
# cite:tazmosaic (time mosaic, WCS EO dataset, WMTS dimensions) comes from
# ows/setup.sh.
compliance.layers=cite:Autos,cite:BasicPolygons,cite:Bridges,cite:BuildingCenters,cite:Buildings,\
  cite:DividedRoutes,cite:Forests,cite:Lakes,cite:LakesWithElevation,cite:MapNeatline,\
  cite:NamedPlaces,cite:Ponds,cite:RoadSegments,cite:Streams,\
  topp:tazdem,topp:tazbm,topp:rotated,\
  sf:PrimitiveGeoFeature,sf:AggregateGeoFeature,sf:Entit\u00e9G\u00e9n\u00e9rique,\
  cdf:Deletes,cdf:Fifteen,cdf:Inserts,cdf:Locks,cdf:Nulls,cdf:Other,cdf:Seven,cdf:Updates,\
  cgf:Lines,cgf:MLines,cgf:MPoints,cgf:MPolygons,cgf:Points,cgf:Polygons,\
  cdf:W020N90,cdf:usa,\
  cite:tazmosaic

# Layers that the user "limited" (password "limited") may read (READ only);
# used by check-ows.py for the permission checks.
compliance.limitedLayers=cite:Lakes,cite:Forests,sf:PrimitiveGeoFeature,topp:tazdem,cdf:Seven,cgf:Lines

# WPS processes (WpsProcess entities) with READ for the test user and for the
# user "limited" ("*" = all, "JTS:*" = all of a namespace).
compliance.wpsProcesses=*
compliance.limitedWpsProcesses=JTS:*,gs:Bounds

# Hosts whose WMS style URLs (SLD, STYLE_URL) the interceptor may read; the
# check script serves SLD files from GeoServer's www folder.
geoserver.interceptor.styleUrlHosts=geoserver:8080

# GeoServer account that the interceptors add to forwarded requests
# (default admin account of the GeoServer data dir).
geoserver.username=admin
geoserver.password=geoserver
