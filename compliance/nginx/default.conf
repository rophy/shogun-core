# TEAM Engine cannot log in to SHOGun-Core, so this proxy adds a Basic auth
# header for the test user to every request. Only for the local test setup.
server {
    listen 80;
    client_max_body_size 50m;

    location / {
        proxy_pass http://shogun:8080;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization "Basic ${SHOGUN_BASIC_AUTH}";
        proxy_read_timeout 300s;
    }
}
